name: Continuous Integration

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

  push:
    branches: ["main", "dev"]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Install and cache dependencies
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

  # Type checking
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Restore node_modules
        id: cache-modules-typecheck
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-modules-typecheck.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate next-env.d.ts
        continue-on-error: true
        run: npx next typegen

      - name: Generate posts artifact
        # tsc resolves `import ... from "@/lib/posts.generated.json"` (news
        # pages) — the file must exist before this step.
        run: npm run posts

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

  # Linting
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Restore node_modules
        id: cache-modules-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-modules-lint.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Prettier check
  format:
    name: Prettier Check
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-modules-format
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-modules-format.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run Prettier
        run: npm run format:check

  # Build check
  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Restore node_modules
        id: cache-modules-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-modules-build.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{js,jsx,ts,tsx}', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: build-output
          path: .next
          retention-days: 1

  # Test suite (ready for when you add tests)
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true # Don't fail CI if no tests exist yet

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Restore node_modules
        id: cache-modules-test
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-modules-test.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check if test script exists
        id: check-test
        run: |
          if npm run | grep -q "test"; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No test script found. Skipping tests."
          fi

      - name: Run tests
        if: steps.check-test.outputs.has_tests == 'true'
        run: npm test

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    continue-on-error: true # Security issues shouldn't block PR, but should be visible

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

  # Final status check
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [typecheck, lint, format, build, test, security]
    if: always()
    env:
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      FORMAT_RESULT: ${{ needs.format.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      TEST_RESULT: ${{ needs.test.result }}
      SECURITY_RESULT: ${{ needs.security.result }}

    steps:
      - name: Check CI Status
        run: |
          echo "## CI Summary"
          echo ""

          if [[ "$TYPECHECK_RESULT" == "success" ]]; then
            echo "TypeScript: Passed"
          else
            echo "TypeScript: Failed"
          fi

          if [[ "$LINT_RESULT" == "success" ]]; then
            echo "ESLint: Passed"
          else
            echo "ESLint: Failed"
          fi

          if [[ "$FORMAT_RESULT" == "success" ]]; then
            echo "Prettier: Passed"
          else
            echo "Prettier: Failed"
          fi

          if [[ "$BUILD_RESULT" == "success" ]]; then
            echo "Build: Passed"
          else
            echo "Build: Failed"
          fi

          if [[ "$TEST_RESULT" == "success" || "$TEST_RESULT" == "skipped" ]]; then
            echo "Tests: Passed/Skipped"
          else
            echo "Tests: Failed (non-blocking)"
          fi

          if [[ "$SECURITY_RESULT" == "success" ]]; then
            echo "Security: No issues"
          else
            echo "Security: Check warnings (non-blocking)"
          fi

          if [[ "$TYPECHECK_RESULT" != "success" ]] || \
             [[ "$LINT_RESULT" != "success" ]] || \
             [[ "$BUILD_RESULT" != "success" ]] || \
             [[ "$FORMAT_RESULT" != "success" ]]; then
            echo ""
            echo "CI Failed - Please fix the errors above"
            exit 1
          else
            echo ""
            echo "All required checks passed!"
          fi
